<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rain Rider">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230c0f14'/%3E%3Cpath d='M12 15a9 9 0 0 1 17-3 7 7 0 0 1 1 14H11a6 6 0 0 1 1-11z' fill='%232b3953'/%3E%3Cpath d='M14 30l-2 5M21 30l-2 5M28 30l-2 5' stroke='%234aa8ff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='31' cy='11' r='4' fill='%23d4ff3a'/%3E%3C/svg%3E">
<title>Rain Rider</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14; --card:#151a23; --card2:#1d2431; --line:#2a3344; --text:#eef2f7; --muted:#8d99ad;
  --accent:#d4ff3a; --ink:#141a00;
  --dry:#35d07f; --low:#c9d84a; --mid:#ffa53a; --wet:#ff5468;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
#map{position:fixed;inset:0;background:#10151d}

.panel{position:fixed;z-index:1000;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 34px #000a}
#top{top:calc(12px + var(--st));left:12px;right:12px;max-width:420px;border-radius:16px;padding:6px}
#bottom{left:0;right:0;bottom:0;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + var(--sb));border-bottom:0}
@media (min-width:700px){ #bottom{left:12px;right:auto;width:420px;bottom:12px;border-radius:18px;border-bottom:1px solid var(--line);padding-bottom:16px} }

.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 8px;position:relative}
.row + .row{border-top:1px solid var(--line)}
.dot{flex:0 0 12px;height:12px;border-radius:50%;border:3px solid var(--accent)}
.dot.end{border-radius:3px;background:var(--wet);border-color:var(--wet)}
.dot.via{border-color:var(--muted);width:10px;flex-basis:10px;height:10px}
.row input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;padding:12px 0}
.row input::placeholder{color:var(--muted)}
.row .x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:6px}
.chips{display:flex;gap:8px;flex:1;padding:6px 0}
.chip{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:600;font-size:14px}
.chip.on,.chip:active{background:var(--accent);color:var(--ink);border-color:transparent}
.loc{flex:1;font-weight:600;color:var(--accent);background:none;border:0;text-align:left;padding:12px 0}
.grip{flex:0 0 auto;display:grid;place-items:center;width:34px;height:40px;margin-right:-6px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip:active{cursor:grabbing;color:var(--text)}
.rows .row{transition:transform .15s ease;background:var(--card)}
.rows .row.dragging{transition:none;z-index:10;border-radius:12px;box-shadow:0 8px 24px #000c;background:var(--card2)}
.rwrap{display:flex;align-items:center}
.rwrap .rows{flex:1;min-width:0}
.swap{flex:0 0 36px;height:36px;margin:0 2px 0 4px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);display:grid;place-items:center}
.swap:active{background:var(--accent);color:var(--ink)}
.info{font-size:15px;line-height:1.5;margin:0 0 16px}
.info ol{margin:8px 0 0;padding-left:20px}
.info li{margin-bottom:6px}
.add{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:10px 8px 6px 30px}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:5;background:#1f2736;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 30px #000b;margin-top:4px}
.sugg div{padding:12px 14px;border-bottom:1px solid #283146}
.sugg div:active,.sugg div.on{background:#2a3550}
.sugg small{display:block;color:var(--muted);font-size:12px}

.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px 10px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line)}
.btn.main{background:var(--accent);color:var(--ink);border-color:transparent}
.btn:disabled{opacity:.55}

.pill{display:inline-block;padding:5px 12px;border-radius:99px;font-weight:800;font-size:13px;letter-spacing:.3px;color:#0c0f14}
.pill.dry{background:var(--dry)} .pill.low{background:var(--low)} .pill.mid{background:var(--mid)} .pill.wet{background:var(--wet)}
.rhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.close{background:var(--card2);border:0;border-radius:50%;width:34px;height:34px;font-size:20px;color:var(--muted)}
.big{font-size:22px;font-weight:800;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.sum{margin:10px 0 4px;font-size:15px}
.stops{color:var(--muted);font-size:13px;margin:2px 0 0}
.keys{display:flex;gap:12px;color:var(--muted);font-size:12px;margin:10px 0 12px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.loading{display:flex;align-items:center;gap:12px;padding:6px 0 4px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#ff9aa6;margin:0 0 12px}
#bottom.res{max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);overflow-y:hidden;overscroll-behavior:contain}
#bottom.res.open{overflow-y:auto}
.grab{display:block;width:44px;height:5px;border:0;padding:0;border-radius:3px;background:var(--line);margin:-4px auto 12px}
.det{display:none}
#bottom.open .det{display:block}
#bottom.open .hintup{display:none}
.hintup{display:block;width:100%;background:none;border:0;color:var(--muted);font-size:13px;padding:12px 0 0;text-align:center}
.det h4{margin:20px 0 4px;font-size:15px}
.small{color:var(--muted);font-size:12px;margin:2px 0 8px}
.ex{display:flex;gap:10px;margin-bottom:10px}
.ex a{flex:1;text-align:center;text-decoration:none}
.scrollx{overflow-x:auto;padding:16px 0 4px}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px}
.bar{flex:0 0 10px;border-radius:3px 3px 0 0;opacity:.8;cursor:pointer}
.bar.sel{outline:2px solid #fff;outline-offset:1px;opacity:1}
.axis{display:flex;gap:2px;color:var(--muted);font-size:10px;margin-top:3px}
.axis span{flex:0 0 10px;white-space:nowrap}
.hgrid{display:grid;gap:1px;font-size:10px}
.hcell{height:18px;border-radius:2px;cursor:pointer}
.hcell.path{outline:2px solid var(--accent);outline-offset:-1px}
.hcell.tap{box-shadow:0 0 0 2px #fff inset}
.hlab{position:sticky;left:0;background:var(--card);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;line-height:18px;z-index:2}
.hcorner{position:sticky;left:0;background:var(--card);z-index:3}
.hhead{color:var(--muted);text-align:center}

.modal-bg{position:fixed;inset:0;z-index:2000;background:#000a;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){ .modal-bg{align-items:center} }
.modal{background:var(--card);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sb));border:1px solid var(--line)}
@media (min-width:700px){ .modal{border-radius:18px} }
.modal h3{margin:0 0 14px;font-size:19px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card2);border-radius:13px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:10px;padding:11px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;font-weight:600;min-width:0}
.fields input{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--text);min-height:48px;width:100%;min-width:0;-webkit-appearance:none;appearance:none;color-scheme:dark}
.mhint{color:var(--muted);font-size:13px;margin:12px 0 14px;min-height:18px}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;border:3px solid #0c0f14;box-shadow:0 2px 10px #000a}
.mk.s{background:var(--accent);color:var(--ink)} .mk.e{background:var(--wet);color:#fff} .mk.v{background:#e7ecf3;color:#0c0f14}
.me{width:16px;height:16px;border-radius:50%;background:#4aa8ff;border:3px solid #fff;box-shadow:0 0 0 6px #4aa8ff44}
.leaflet-container{font:13px Inter,sans-serif}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1d2431;color:var(--text)}
.leaflet-bar a,.leaflet-bar a:hover{background:#151a23;color:var(--text);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:#0c0f14aa!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:#9cc6ff!important}
.leaflet-top{top:calc(var(--st) + 150px)}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="top"><div id="editor"></div></div>

<div class="panel" id="bottom" hidden></div>

<div class="modal-bg" id="laterBg" hidden>
  <div class="modal" role="dialog" aria-label="Leave later">
    <h3>Leave later</h3>
    <div class="seg" id="seg">
      <button type="button" data-k="depart">Depart at</button>
      <button type="button" data-k="arrive">Arrive by</button>
      <button type="button" data-k="optimize">Driest time</button>
    </div>
    <div class="fields">
      <label>Day<input type="date" id="mDate"></label>
      <label><span id="mTimeLabel">Time</span><input type="time" id="mTime"></label>
    </div>
    <p class="mhint" id="mHint"></p>
    <div class="btns"><button class="btn" id="mCancel" type="button">Cancel</button><button class="btn main" id="mGo" type="button">Check rain</button></div>
  </div>
</div>

<div class="modal-bg" id="infoBg" hidden>
  <div class="modal" role="dialog" aria-label="Location">
    <h3>Can't get your location</h3>
    <div class="info" id="infoText"></div>
    <div class="btns"><button class="btn" id="infoStart" type="button">Choose start instead</button><button class="btn main" id="infoRetry" type="button">Try again</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const MODELS = ['ecmwf_ifs025','icon_seamless','gfs_seamless','meteofrance_seamless','ukmo_seamless'];
const MODELS_FALLBACK = ['ecmwf_ifs025','icon_seamless','gfs_seamless'];
const ROUTERS = [
  {base:'https://router.project-osrm.org/route/v1/driving/', name:'OSRM'},
  {base:'https://routing.openstreetmap.de/routed-car/route/v1/driving/', name:'OSRM (FOSSGIS)'}
];
const STEP_MIN = 15;
const MAX_SAMPLES = 40;

const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function fetchJSON(url, ms=20000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(url, {signal: ctl.signal});
    const j = await r.json().catch(() => null);
    if (!r.ok || (j && j.error)) throw new Error((j && (j.reason || j.message)) || ('HTTP ' + r.status));
    return j;
  } finally { clearTimeout(t); }
}
function hav(a, b){
  const R = 6371000, toR = Math.PI/180;
  const dLat = (b[0]-a[0])*toR, dLon = (b[1]-a[1])*toR;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s, n){ const [y,m,d] = s.split('-').map(Number); return ymd(new Date(y, m-1, d+n)); }
function hm2min(s){ const [h,m] = (s||'0:0').split(':').map(Number); return h*60 + (m||0); }
function fmtDur(sec){ const m = Math.round(sec/60); const h = Math.floor(m/60); return h ? `${h}h ${String(m%60).padStart(2,'0')}m` : `${m} min`; }

async function getRoute(pts){
  const coords = pts.map(p => `${(+p.lon).toFixed(5)},${(+p.lat).toFixed(5)}`).join(';');
  let lastErr;
  for (const r of ROUTERS) {
    try {
      const j = await fetchJSON(r.base + coords + '?overview=full&geometries=geojson&steps=false', 15000);
      if (j.code === 'Ok' && j.routes && j.routes.length) {
        const rt = j.routes[0];
        return {
          coords: rt.geometry.coordinates.map(([lon, lat]) => [lat, lon]),
          distance: rt.distance,
          legs: rt.legs.map(l => ({distance: l.distance, duration: l.duration})),
          source: r.name
        };
      }
      lastErr = new Error(j.message || j.code);
    } catch (e) { lastErr = e; }
  }
  throw new Error('Could not calculate a road route (' + (lastErr && lastErr.message) + '). Check the stops are reachable by road.');
}


function buildTimeline(route, dwellSec, pace){
  const c = route.coords, cum = [0];
  for (let i = 1; i < c.length; i++) cum.push(cum[i-1] + hav(c[i-1], c[i]));
  const geomTotal = cum[cum.length-1] || 1, scale = route.distance / geomTotal;
  const legs = route.legs, legStart = [];
  let d = 0, t = 0;
  legs.forEach((l, k) => { legStart.push({d, t}); d += l.distance; t += l.duration*pace + (k < legs.length-1 ? dwellSec : 0); });
  const rideSec = legs.reduce((a, l) => a + l.duration*pace, 0);
  const totalSec = legStart[legs.length-1].t + legs[legs.length-1].duration*pace;
  const legOf = D => { for (let i = 0; i < legs.length; i++) if (D <= legStart[i].d + legs[i].distance + 1) return i; return legs.length-1; };
  const timeAt = D => { const k = legOf(D); const L_ = legs[k]; const f = L_.distance ? clamp((D - legStart[k].d)/L_.distance, 0, 1) : 0; return legStart[k].t + f*L_.duration*pace; };
  const pointAt = D => { // D in route metres -> [lat,lon], geometry index
    const g = D / scale; let lo = 0, hi = cum.length-1;
    while (hi - lo > 1) { const mid = (lo+hi) >> 1; if (cum[mid] <= g) lo = mid; else hi = mid; }
    const seg = cum[hi] - cum[lo] || 1, f = clamp((g - cum[lo])/seg, 0, 1);
    return {p: [c[lo][0] + (c[hi][0]-c[lo][0])*f, c[lo][1] + (c[hi][1]-c[lo][1])*f], gi: lo};
  };
  const total = route.distance;
  const n = clamp(Math.ceil(total / 5000) + 1, 2, MAX_SAMPLES);
  const samples = [];
  for (let i = 0; i < n; i++) {
    const D = total * i/(n-1); const {p, gi} = pointAt(D);
    samples.push({i, d: D, lat: p[0], lon: p[1], t: timeAt(D), gi, leg: legOf(D)});
  }
  samples.forEach((s, i) => {
    const a = i ? samples[i-1].d : s.d, b = i < n-1 ? samples[i+1].d : s.d;
    s.w = ((b - a)/2) / total * rideSec / 60;
  });
  const stopTimes = legs.map((l, k) => ({arrive: k ? legStart[k].t - dwellSec : 0, leave: legStart[k].t}));
  stopTimes.push({arrive: totalSec, leave: totalSec});
  return {samples, totalSec, rideSec, legStart, stopTimes};
}


async function getWeather(samples, date, consensus){
  const lat = samples.map(s => s.lat.toFixed(3)).join(','), lon = samples.map(s => s.lon.toFixed(3)).join(',');
  const base = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&timeformat=unixtime&start_date=${date}&end_date=${addDays(date, 1)}`;
  const pBest = fetchJSON(base + '&hourly=precipitation,precipitation_probability,weather_code,temperature_2m,wind_speed_10m,wind_gusts_10m&minutely_15=precipitation', 25000);
  let pModels = null;
  if (consensus) {
    pModels = fetchJSON(base + '&hourly=precipitation&models=' + MODELS.join(','), 25000)
      .catch(() => fetchJSON(base + '&hourly=precipitation&models=' + MODELS_FALLBACK.join(','), 25000))
      .catch(() => null);
  }
  let [a, b] = await Promise.all([pBest, pModels]);
  if (!Array.isArray(a)) a = [a];
  if (b && !Array.isArray(b)) b = [b];
  return samples.map((s, i) => prepWx(a[i], b ? b[i] : null));
}
function prepWx(best, multi){
  const H = best.hourly, M = best.minutely_15;
  const models = [];
  if (multi && multi.hourly) for (const k of Object.keys(multi.hourly)) if (k.startsWith('precipitation_')) models.push({name: k.slice(14), v: multi.hourly[k], t0: multi.hourly.time[0]});
  return {H, M, models, tz: best.timezone, t0: H.time[0]};
}

function wxAt(w, t){
  const H = w.H, n = H.time.length;
  const fi = (t - w.t0) / 3600;
  const iEnd = clamp(Math.floor(fi + 1e-6) + 1, 0, n-1);           // hour bucket containing t
  const i0 = clamp(Math.floor(fi), 0, n-1), i1 = clamp(i0+1, 0, n-1), f = clamp(fi - i0, 0, 1);
  const lerp = arr => { if (!arr) return null; const a = arr[i0], b = arr[i1]; if (a == null) return b; if (b == null) return a; return a + (b-a)*f; };
  let rate = H.precipitation ? H.precipitation[iEnd] : 0;  // mm/h
  if (w.M && w.M.precipitation) {
    const j = Math.floor((t - w.M.time[0]) / 900 + 1e-6) + 1;
    const v = w.M.precipitation[clamp(j, 0, w.M.precipitation.length-1)];
    if (v != null) rate = Math.max(v * 4, rate * 0.5); // 15-min detail, but don't erase an hourly signal entirely
  }
  rate = rate || 0;
  const pp = H.precipitation_probability ? H.precipitation_probability[iEnd] : null;
  let wetModels = 0, nModels = 0, modelMax = 0;
  for (const m of w.models) { const v = m.v[iEnd]; if (v == null) continue; nModels++; if (v >= 0.1) wetModels++; modelMax = Math.max(modelMax, v); }
  const agree = nModels ? 100 * wetModels / nModels : null;
  let prob;
  if (pp != null && agree != null) prob = 0.5*pp + 0.5*agree;
  else if (pp != null) prob = pp;
  else if (agree != null) prob = agree;
  else prob = rate >= 0.1 ? 70 : 0;
  let before = 0; for (let k = iEnd-3; k < iEnd; k++) if (k >= 0 && H.precipitation[k] != null) before += H.precipitation[k];
  return {
    rate, prob: clamp(prob, 0, 100), pp, agree, nModels, modelMax, before,
    temp: lerp(H.temperature_2m), wind: lerp(H.wind_speed_10m), gust: lerp(H.wind_gusts_10m),
    code: H.weather_code ? H.weather_code[iEnd] : null, hourIdx: iEnd
  };
}


function classify(e){
  if (e.maxProb < 20 && e.rainMin < 1 && e.mm < 0.2) return 'dry';
  if (e.maxProb < 40 && e.mm < 0.6) return 'low';
  if (e.maxProb < 65 && e.mm < 2) return 'mid';
  return 'wet';
}

function evaluate(dep, tl, wx){
  let cost = 0, maxProb = 0, mm = 0, rainMin = 0, wetMin = 0, minT = Infinity, maxT = -Infinity, maxGust = 0;
  const segs = tl.samples.map((s, i) => {
    const t = dep + s.t, w = wxAt(wx[i], t);
    const p = w.prob / 100, inten = Math.min(w.rate, 6);
    cost += s.w * (p + 0.35*inten + (w.before > 0.5 && w.rate < 0.1 ? 0.12 : 0) + (w.gust > 50 ? 0.1 : 0));
    maxProb = Math.max(maxProb, w.prob);
    mm += w.rate * s.w / 60;
    if (w.prob >= 50 || w.rate >= 0.3) rainMin += s.w;
    if (w.before > 0.5) wetMin += s.w;
    if (w.temp != null) { minT = Math.min(minT, w.temp); maxT = Math.max(maxT, w.temp); }

}

async function geocode(q){
  const out = [];
  const near = map.getCenter();
  try {
    const j = await fetchJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lang=en&lat=${near.lat.toFixed(3)}&lon=${near.lng.toFixed(3)}`, 8000);
    for (const f of j.features || []) {
      const p = f.properties || {}; const [lon, lat] = f.geometry.coordinates;
      const name = p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || p.city || q;
      const label = [...new Set([p.street && p.name !== p.street ? p.street : null, p.city !== name ? p.city : null, p.state, p.country].filter(Boolean))].join(', ');
      out.push({name, label, lat, lon});
    }
  } catch (e) {}
  if (!out.length) {
    try {
      const j = await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en`, 8000);
      for (const r of j.results || []) out.push({name: r.name, label: [r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude});
    } catch (e) {}
  }

}

async function run(o){

    const pts = items.map(resolve);
    const names = items.map(x => x.me ? 'My location' : x.name);
    const route = await getRoute(pts);
    const tl = buildTimeline(route, 0, 1);

    else {
      const t = hm2min(o.time) * 60;
      if (o.k === 'depart') c = evaluate(dayStart + t, tl, wx);
      else if (o.k === 'arrive') {
        const dep = dayStart + t - tl.totalSec;
        if (dep < dayStart) throw new Error(`The ride takes ${fmtDur(tl.totalSec)}, so arriving by ${o.time} means leaving the day before. Pick a later time.`);
        if (dep < nowUnix - 60) throw new Error(`The ride takes ${fmtDur(tl.totalSec)}, so you'd have had to leave at ${fmtClock(dep, tz)}. Pick a later time.`);
        c = evaluate(dep, tl, wx);

        const deadline = dayStart + t, last = deadline - tl.totalSec;
        let first = Math.max(dayStart + 5*3600, deadline - 12*3600, Math.ceil((nowUnix + 300) / 900) * 900);
        first = Math.ceil((first - dayStart) / 900) * 900 + dayStart;
        if (last < first) throw new Error(`The ride takes ${fmtDur(tl.totalSec)}. There's no time left to leave and arrive by ${o.time}. Pick a later time.`);
        cands = []; for (let d = first; d <= last; d += STEP_MIN * 60) cands.push(evaluate(d, tl, wx));
        const minCost = Math.min(...cands.map(x => x.cost));
        cands.forEach(x => { x.score = x.cost + (deadline - x.arr) / 3600 * Math.max(0.15, minCost * 0.04); });
        c = cands.reduce((a, x) => x.score < a.score ? x : a, cands[0]);
        const dry = cands.filter(x => x.cls === 'dry').length;
        extra = c.cls === 'dry' ? `Driest time to leave to arrive by ${o.time}.${deadline - c.arr > 3600 ? ' Leaving later means riding in or right after rain.' : ''}` : (dry ? '' : `There's no completely dry time before ${o.time}. This is the least wet option.`);

  const b = $('#bottom'), {c, tz, tl, names, route} = R;
  const day = R.o.k === 'now' || R.date === ymd(new Date()) ? '' : new Date(R.date + 'T12:00').toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}) + ' · ';
  const stopsTxt = names.length > 2 ? names.slice(1, -1).map((n, k) => `${esc(n)} ${fmtClock(c.dep + tl.stopTimes[k + 1].arrive, tz)}`).join(' · ') : '';
  b.hidden = false;
  const now = R.o.k === 'now', vias = names.length > 2;
  const ex = now ? `<div class="ex"><a class="btn main" href="${gmapsUrl()}" target="_blank" rel="noopener">Google Maps</a><a class="btn main" href="${wazeUrl()}" target="_blank" rel="noopener">Waze</a></div>${vias ? '<p class="small">Waze takes one stop at a time, so it opens with your first stop.</p>' : ''}` : '';
  b.classList.add('res'); b.classList.toggle('open', sheetOpen);
  b.innerHTML = `
    <button class="grab" id="grab" type="button" aria-label="Show rain graphs"></button>
    <div class="rhead"><span class="pill ${c.cls}">${LABEL[c.cls]}</span><button class="close" id="rClose" type="button" aria-label="Close">×</button></div>
    <div class="big">Leave ${fmtClock(c.dep, tz)} → Arrive ${fmtClock(c.arr, tz)}</div>
    <div class="sub">${day}${Math.round(route.distance / 1000)} km · ${fmtDur(tl.totalSec)}${isFinite(c.minT) ? ` · ${Math.round(c.minT)}–${Math.round(c.maxT)}°C` : ''}</div>
    ${stopsTxt ? `<p class="stops">Stops: ${stopsTxt}</p>` : ''}
    <p class="sum">${R.extra ? esc(R.extra) + ' ' : ''}${esc(rainLine())}</p>
    <div class="keys"><span><i style="background:var(--dry)"></i>Dry</span><span><i style="background:var(--low)"></i>Maybe</span><span><i style="background:var(--mid)"></i>Showers</span><span><i style="background:var(--wet)"></i>Rain</span></div>
    ${ex}
    <div class="btns"><button class="btn" id="later" type="button">Leave later</button><button class="btn${now ? '' : ' main'}" id="now" type="button">Go now</button></div>
    <button class="hintup" id="hintup" type="button">︿ Swipe up for rain graphs</button>
    <div class="det">
      <h4>${R.o0.k === 'optimize' ? 'Rain on the ride by departure time' : 'Rain on the ride if you leave at other times'}</h4>
      <p class="small">Taller bar = more rain. Tap a bar to see that departure.</p>
      <div class="scrollx" id="strip"></div>
      <h4>Rain along the route, hour by hour</h4>
      <p class="small">Each row is a point on your route. Outlined squares show where you'll be. Tap a square for details.</p>
      <div class="scrollx" id="heat"></div>
      <p class="small" id="heatInfo"></p>
    </div>`;
  renderStrip(); renderHeat();
  $('#grab').onclick = () => setOpen(!sheetOpen);
  $('#hintup').onclick = () => setOpen(true);
  $('#rClose').onclick = () => { R = null; routeLayer.clearLayers(); drawPlaces(false); renderBottom(); };
  $('#now').onclick = () => run({k: 'now'});
  $('#later').onclick = openLater;
}

// ---------- export ----------
function gmapsUrl(){
  const it = [S.from, ...S.vias, S.to], f = p => `${p.lat},${p.lon}`;
  const way = S.vias.map(resolve).filter(Boolean).map(f).join('|');
  const from = S.from.me ? '' : `&origin=${f(resolve(S.from))}`;
  return `https://www.google.com/maps/dir/?api=1${from}&destination=${f(resolve(S.to))}${way ? '&waypoints=' + encodeURIComponent(way) : ''}&travelmode=driving`;
}
function wazeUrl(){
  const p = resolve(S.vias.length ? S.vias[0] : S.to);
  return `https://waze.com/ul?ll=${p.lat}%2C${p.lon}&navigate=yes`;
}

// ---------- rain graphs ----------
let sheetOpen = false;
function setOpen(v){ sheetOpen = v; const b = $('#bottom'); b.classList.toggle('open', v); if (!v) b.scrollTop = 0; }
(function(){
  const b = $('#bottom'); let y0 = null, st = 0;
  b.addEventListener('touchstart', e => { if (!b.classList.contains('res')) return; y0 = e.touches[0].clientY; st = b.scrollTop; }, {passive: true});
  b.addEventListener('touchmove', e => {
    if (y0 == null) return; const dy = e.touches[0].clientY - y0;
    if (!sheetOpen && dy < -25) { setOpen(true); y0 = null; }
    else if (sheetOpen && st <= 0 && b.scrollTop <= 0 && dy > 70) { setOpen(false); y0 = null; }
  }, {passive: true});
  b.addEventListener('touchend', () => { y0 = null; });
  b.addEventListener('wheel', e => {
    if (!b.classList.contains('res')) return;
    if (!sheetOpen && e.deltaY > 0) { e.preventDefault(); setOpen(true); }
    else if (sheetOpen && e.deltaY < 0 && b.scrollTop <= 0) setOpen(false);
  }, {passive: false});
})();
const CL = {dry: '#35d07f', low: '#c9d84a', mid: '#ffa53a', wet: '#ff5468'};
function rainCellColor(p, r){
  if (r >= 2.5) return '#9b6bff';
  if (p >= 65 || r >= 1) return '#3f8ff0';
  if (p >= 40 || r >= 0.3) return '#2f6fb8';
  if (p >= 20 || r >= 0.1) return '#2d5d8f';
  if (p >= 8) return '#22344d';
  return '#1b2230';
}
function renderStrip(){
  const box = $('#strip'), {cands, c, tz} = R; box.innerHTML = '';
  if (!cands || !cands.length) { box.textContent = 'No other departure times left today.'; return; }
  const bars = el('div', 'bars'), axis = el('div', 'axis');
  const max = Math.max(...cands.map(x => x.cost), 1);
  cands.forEach(x => {
    const bar = el('div', 'bar' + (Math.abs(x.dep - c.dep) < 450 ? ' sel' : ''));
    bar.style.height = (6 + 94 * x.cost / max) + '%'; bar.style.background = CL[x.cls];
    bar.title = `Leave ${fmtClock(x.dep, tz)} → ${LABEL[x.cls]} · up to ${Math.round(x.maxProb)}%`;
    bar.onclick = () => pickDeparture(x);
    bars.appendChild(bar);
    const t = fmtClock(x.dep, tz); axis.appendChild(el('span', null, t.endsWith(':00') && +t.slice(0, 2) % 2 === 0 ? t.slice(0, 2) : ''));
  });
  box.append(bars, axis);
}
function pickDeparture(x){
  const same = Math.abs(x.dep - R.c0.dep) < 60;
  R.c = same ? R.c0 : x;
  R.o = same ? R.o0 : {k: 'depart', date: R.date, time: fmtClock(x.dep, R.tz)};
  R.extra = same ? R.extra0 : '';
  const sc = $('#bottom').scrollTop; drawRoute(); renderResult(); $('#bottom').scrollTop = sc;
}
function renderHeat(){
  const {c, tl, wx, dayStart, names, tz} = R, S_ = tl.samples, box = $('#heat');
  const h0 = Math.max(0, Math.floor((c.dep - dayStart) / 3600) - 3), h1 = Math.min(wx[0].H.time.length - 2, Math.ceil((c.arr - dayStart) / 3600) + 3);
  const hours = []; for (let h = h0; h <= h1; h++) hours.push(h);
  const grid = el('div', 'hgrid');
  grid.style.gridTemplateColumns = `74px repeat(${hours.length}, minmax(22px, 1fr))`;
  grid.appendChild(el('div', 'hcorner'));
  hours.forEach(h => grid.appendChild(el('div', 'hhead', String(h % 24).padStart(2, '0'))));
  const stopRow = {};
  tl.stopTimes.forEach((st, k) => { let bi = 0, bd = Infinity; S_.forEach((s, i) => { const d = Math.abs(s.t - st.arrive); if (d < bd) { bd = d; bi = i; } }); stopRow[bi] = names[k]; });
  S_.forEach((s, i) => {
    const lab = stopRow[i] || `km ${Math.round(s.d / 1000)}`;
    grid.appendChild(el('div', 'hlab', stopRow[i] ? `<b style="color:var(--text)">${esc(lab)}</b>` : lab));
    const path = c.segs[i].hourIdx;
    hours.forEach(h => {
      const w = wxAt(wx[i], dayStart + h * 3600 + 1800);
      const cell = el('div', 'hcell' + (w.hourIdx === path ? ' path' : ''));
      cell.style.background = rainCellColor(w.prob, w.rate);
      const info = `${lab} · ${String(h % 24).padStart(2, '0')}:00–${String((h + 1) % 24).padStart(2, '0')}:00 · ${Math.round(w.prob)}% chance · ${w.rate.toFixed(1)} mm/h${w.temp != null ? ' · ' + Math.round(w.temp) + '°C' : ''}`;
      cell.title = info;
      cell.onclick = () => { box.querySelectorAll('.hcell.tap').forEach(z => z.classList.remove('tap')); cell.classList.add('tap'); $('#heatInfo').textContent = info; };
      grid.appendChild(cell);
    });
  });
  box.innerHTML = ''; box.appendChild(grid);
}

// ---------- boot ----------
renderEditor(); renderBottom();
if (navigator.permissions && window.isSecureContext) {
  navigator.permissions.query({name: 'geolocation'}).then(p => { if (p.state === 'granted') locate().then(() => { if (!S.to) map.setView([myPos.lat, myPos.lon], 12); }).catch(() => {}); }).catch(() => {});
}
